<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>حِرَفي</title>
  <style>
    :root { --green: #2a724d; --ink: #14241b; --muted: #5f6f66; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fff; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 32px; text-align: center; color: var(--ink);
    }
    img { width: 88px; height: 88px; }
    h1 { font-size: 19px; margin: 0 0 6px; }
    p { font-size: 15px; line-height: 1.7; color: var(--muted); margin: 0; max-width: 300px; }
    button {
      font: inherit; font-weight: 700; font-size: 15px; color: #fff; background: var(--green);
      border: 0; border-radius: 16px; padding: 14px 32px; cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; }
  </style>
</head>
<body>
  <img src="icon.png" alt="حِرَفي" />
  <div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكد من تشغيل الإنترنت أو الواي فاي، ثم أعد المحاولة.</p>
  </div>
  <button id="retry">إعادة المحاولة</button>
  <script>
    var target = window.HERAFI_URL || 'https://sanaei1489.builtwithrocket.new/home-screen';
    function retry() {
      var b = document.getElementById('retry');
      b.disabled = true; b.textContent = 'جارٍ الاتصال…';
      window.location.replace(target);
      setTimeout(function () { b.disabled = false; b.textContent = 'إعادة المحاولة'; }, 6000);
    }
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
